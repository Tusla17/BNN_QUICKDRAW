adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
transport select jtag

# Khai báo chính xác JTAG TAP cho FPGA Cyclone 10 LP (10CL025)
jtag newtap 10cl025 tap -irlen 10 -expected-id 0x020f30dd

# Ép lấy mẫu sườn xuống để chống nhiễu ở tần số JTAG cao
ftdi tdo_sample_edge falling
adapter speed 2000
